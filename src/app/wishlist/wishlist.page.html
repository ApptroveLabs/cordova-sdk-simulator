<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>My Wishlist</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="wishlist-container" *ngIf="wishlist.length > 0; else emptyState">
    <ion-list lines="none">
      <ion-item *ngFor="let item of wishlist" (click)="viewProduct(item)" class="wishlist-item">
        <ion-thumbnail slot="start">
          <img [src]="item.imageUrl" />
        </ion-thumbnail>
        <ion-label>
          <h2>{{ item.name }}</h2>
          <p>{{ item.category }}</p>
          <span class="price">${{ item.price }}</span>
        </ion-label>
        <ion-button fill="clear" slot="end" (click)="removeFromWishlist(item, $event)">
          <ion-icon name="trash-outline" color="danger"></ion-icon>
        </ion-button>
      </ion-item>
    </ion-list>
  </div>

  <ng-template #emptyState>
    <div class="empty-state ion-text-center">
      <ion-icon name="heart-dislike-outline"></ion-icon>
      <h2>Your wishlist is empty</h2>
      <p>Items added to your wishlist will show up here.</p>
      <ion-button expand="block" routerLink="/home" mode="ios" class="ion-margin-top">
        Explore Products
      </ion-button>
    </div>
  </ng-template>
</ion-content>
