<ion-content class="ion-padding">
  <div class="login-container">
    <div class="logo-section ion-text-center">
      <img src="assets/app_logo.png" class="app-logo" />
      <h1>Welcome Back!</h1>
      <p>Sign in to continue shopping</p>
    </div>

    <div class="form-section">
      <ion-item lines="none" class="custom-input">
        <ion-icon name="mail-outline" slot="start"></ion-icon>
        <ion-input type="email" placeholder="Email Address" [(ngModel)]="email"></ion-input>
      </ion-item>

      <ion-item lines="none" class="custom-input ion-margin-top">
        <ion-icon name="lock-closed-outline" slot="start"></ion-icon>
        <ion-input type="password" placeholder="Password" [(ngModel)]="password"></ion-input>
      </ion-item>

      <div class="forgot-password ion-text-end">
        <ion-button fill="clear" size="small">Forgot Password?</ion-button>
      </div>

      <ion-button expand="block" (click)="login()" mode="ios" class="ion-margin-top login-btn">
        Login
      </ion-button>

      <ion-button expand="block" fill="outline" (click)="loginAsGuest()" mode="ios" class="ion-margin-top">
        Continue as Guest
      </ion-button>
    </div>

    <div class="footer-section ion-text-center">
      <p>Don't have an account? <a (click)="goToSignup()">Sign Up</a></p>
    </div>
  </div>
</ion-content>
