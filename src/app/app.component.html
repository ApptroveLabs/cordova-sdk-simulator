<ion-app>
  <!-- Side Menu (Drawer) -->
  <ion-menu contentId="main-content" menuId="main-menu" type="overlay">
    <ion-header class="ion-no-border">
      <ion-toolbar color="primary">
        <div class="menu-header ion-padding">
          <div class="avatar-container">
            <img src="assets/app_logo.png" alt="Cordmarket logo" />
          </div>
          <div class="user-info">
            <h3>{{ userEmail || 'Sign In / Register' }}</h3>
            <p *ngIf="userEmail">Member</p>
            <p *ngIf="!userEmail">Reviewer access required</p>
          </div>
        </div>
      </ion-toolbar>
    </ion-header>
    
    <ion-content class="menu-content">
      <ion-list lines="none">
        <ion-item button (click)="navigate('/home')">
          <ion-icon slot="start" name="home-outline"></ion-icon>
          <ion-label>Home</ion-label>
        </ion-item>
        
        <ion-item button *ngIf="userEmail" (click)="navigate('/wishlist')">
          <ion-icon slot="start" name="heart-outline"></ion-icon>
          <ion-label>My Wishlist</ion-label>
        </ion-item>

        <ion-item button *ngIf="userEmail" (click)="showOrders()">
          <ion-icon slot="start" name="bag-handle-outline"></ion-icon>
          <ion-label>My Orders</ion-label>
        </ion-item>

        <ion-item button (click)="shareApp()">
          <ion-icon slot="start" name="share-social-outline"></ion-icon>
          <ion-label>Share Cordmarket</ion-label>
        </ion-item>

        <div class="menu-divider"></div>

        <ion-item button (click)="showPolicy('Privacy Policy')">
          <ion-icon slot="start" name="shield-checkmark-outline"></ion-icon>
          <ion-label>Privacy Policy</ion-label>
        </ion-item>

        <ion-item button (click)="showPolicy('Terms & Conditions')">
          <ion-icon slot="start" name="document-text-outline"></ion-icon>
          <ion-label>Terms & Conditions</ion-label>
        </ion-item>

        <ion-item button (click)="showAbout()">
          <ion-icon slot="start" name="information-circle-outline"></ion-icon>
          <ion-label>About Us</ion-label>
        </ion-item>

        <div class="menu-divider"></div>

        <ion-item button *ngIf="userEmail" (click)="logout()" class="logout-item">
          <ion-icon slot="start" name="log-out-outline"></ion-icon>
          <ion-label>Logout</ion-label>
        </ion-item>

        <ion-item button *ngIf="userEmail" (click)="deleteAccount()" class="delete-item">
          <ion-icon slot="start" name="trash-outline"></ion-icon>
          <ion-label>Delete Account</ion-label>
        </ion-item>

        <ion-item button *ngIf="!userEmail" (click)="navigate('/login')">
          <ion-icon slot="start" name="log-in-outline"></ion-icon>
          <ion-label>Login</ion-label>
        </ion-item>

        <ion-item button *ngIf="!userEmail" (click)="navigate('/signup')">
          <ion-icon slot="start" name="person-add-outline"></ion-icon>
          <ion-label>Sign Up</ion-label>
        </ion-item>

        <ion-item button *ngIf="!userEmail" (click)="navigate('/onboarding')">
          <ion-icon slot="start" name="compass-outline"></ion-icon>
          <ion-label>Onboarding</ion-label>
        </ion-item>
      </ion-list>
    </ion-content>
  </ion-menu>

  <!-- Main App content -->
  <div class="ion-page" id="main-content">
    <ion-router-outlet></ion-router-outlet>
  </div>
</ion-app>
